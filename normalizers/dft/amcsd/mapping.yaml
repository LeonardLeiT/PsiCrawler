source: amcsd
standard: dft
schema_version: "3.0"

source_extra_exclude:
  - _requested_id
  - requested_id
  - source_id
  - source_url
  - structure
  - structure_path

mapping:
  source: {value: amcsd}
  requested_id: {transform: requested_id}
  source_id: {field: source_id}
  source_url: {field: source_url}
  formula: {field: formula}
  formula_reduced: {field: formula_reduced, transform: normalize_formula}
  formula_anonymous: {field: formula_anonymous}
  chemical_system: {field: chemical_system, transform: normalize_chemical_system}
  elements: {field: elements, transform: normalize_elements}
  element_count: {field: elements, transform: count_items}
  composition_reduced: {field: composition_reduced}
  structure: {field: structure}
  lattice_a: {field: lattice_a}
  lattice_b: {field: lattice_b}
  lattice_c: {field: lattice_c}
  angle_alpha: {field: angle_alpha}
  angle_beta: {field: angle_beta}
  angle_gamma: {field: angle_gamma}
  volume: {field: volume}
  density: {field: density}
  density_atomic: {field: density_atomic}
  atom_count: {field: atom_count, transform: to_int}
  crystal_system: {field: crystal_system, transform: lowercase}
  spacegroup_number: {field: spacegroup_number, transform: to_int}
  spacegroup_symbol: {field: spacegroup_symbol}
  point_group: {field: point_group}
  calculation_method: {field: calculation_method}
  functional: {field: functional}
  theoretical: {field: theoretical, transform: to_bool}
  schema_version: {value: "3.0"}
  api_version: {field: api_version}
  property_paths: {field: property_paths}
  retrieved_at: {transform: now}
