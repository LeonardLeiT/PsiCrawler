schema_name: dft
schema_version: "3.0"
description: DFT property contract with explicitly grouped provenance, artifacts and source extensions.

fields:
  source: {"type":"string","nullable":false,"description":"Name of the upstream database or provider.","description_zh":"上游数据源名称。","group":"source_and_record_metadata","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"minLength":1}}
  requested_id: {"type":"string","nullable":true,"description":"Identifier requested by the user or crawler before source lookup.","description_zh":"用户提交给爬虫的查询标识符。","group":"source_and_record_metadata","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"minLength":1}}
  source_id: {"type":"string","nullable":false,"description":"Stable identifier assigned to this record by the upstream source.","description_zh":"上游数据源分配的稳定标识符。","group":"source_and_record_metadata","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"minLength":1}}
  source_url: {"type":"string","nullable":true,"description":"Canonical URL of the upstream record or source page.","description_zh":"上游数据库中该材料或记录的规范页面地址。","group":"source_and_record_metadata","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  formula: {"type":"string","nullable":true,"description":"Chemical formula of the material in the source representation.","description_zh":"数据源报告的材料化学式。","group":"composition_and_identity","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  formula_reduced: {"type":"string","nullable":true,"description":"Reduced chemical formula normalized to the smallest whole-number ratio.","description_zh":"按最简整数比归一化后的化学式。","group":"composition_and_identity","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  chemical_system: {"type":"string","nullable":true,"description":"Unordered chemical system, usually represented as element symbols joined by hyphens.","description_zh":"材料所包含的元素集合，通常按字母顺序用连字符连接。","group":"composition_and_identity","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  elements: {"type":"array","nullable":true,"description":"Unique chemical elements present in the material.","description_zh":"材料中出现的去重元素符号列表。","group":"composition_and_identity","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"items":{"type":"string","pattern":"^[A-Z][a-z]?$"},"uniqueItems":true,"minItems":1}}
  element_count: {"type":"integer","nullable":true,"description":"Number of distinct chemical elements in the composition.","description_zh":"组成中不同元素的数量。","group":"composition_and_identity","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"1","constraints":{"minimum":0}}
  structure: {"type":"object","nullable":true,"description":"Parsed crystal structure, including lattice and site information, when available.","description_zh":"可用时保存的解析后晶体结构对象。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  structure_path: {"type":"string","nullable":true,"description":"Local path to the canonical CIF structure artifact stored under data/dft/<source>/structure/<source_id>/<source_id>.cif.","description_zh":"标准 CIF 结构文件的本地路径，位于 data/dft/<source>/structure/<source_id>/<source_id>.cif。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  lattice_a: {"type":"number","nullable":true,"description":"Length of the first lattice vector.","description_zh":"第一晶格矢量的长度。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"Angstrom","constraints":{"exclusiveMinimum":0}}
  lattice_b: {"type":"number","nullable":true,"description":"Length of the second lattice vector.","description_zh":"第二晶格矢量的长度。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"Angstrom","constraints":{"exclusiveMinimum":0}}
  lattice_c: {"type":"number","nullable":true,"description":"Length of the third lattice vector.","description_zh":"第三晶格矢量的长度。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"Angstrom","constraints":{"exclusiveMinimum":0}}
  angle_alpha: {"type":"number","nullable":true,"description":"Angle between the second and third lattice vectors.","description_zh":"第二、第三晶格矢量之间的夹角。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"degree","constraints":{"exclusiveMinimum":0,"exclusiveMaximum":180}}
  angle_beta: {"type":"number","nullable":true,"description":"Angle between the first and third lattice vectors.","description_zh":"第一、第三晶格矢量之间的夹角。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"degree","constraints":{"exclusiveMinimum":0,"exclusiveMaximum":180}}
  angle_gamma: {"type":"number","nullable":true,"description":"Angle between the first and second lattice vectors.","description_zh":"第一、第二晶格矢量之间的夹角。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"degree","constraints":{"exclusiveMinimum":0,"exclusiveMaximum":180}}
  volume: {"type":"number","nullable":true,"description":"Volume of the unit cell.","description_zh":"晶胞体积。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"Angstrom^3","constraints":{"exclusiveMinimum":0}}
  density: {"type":"number","nullable":true,"description":"Mass density calculated or reported for the material.","description_zh":"材料的质量密度。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"g/cm^3","constraints":{"exclusiveMinimum":0}}
  atom_count: {"type":"integer","nullable":true,"description":"Total number of atoms in the represented structure or record.","description_zh":"结构或计算晶胞中的原子总数。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"1","constraints":{"minimum":0}}
  crystal_system: {"type":"string","nullable":true,"description":"Crystal-system classification, such as cubic or triclinic.","description_zh":"晶系分类，例如立方、四方或三斜。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"enum":["triclinic","monoclinic","orthorhombic","tetragonal","trigonal","hexagonal","cubic"]}}
  spacegroup_number: {"type":"integer","nullable":true,"description":"International space-group number of the structure.","description_zh":"结构所属空间群的国际编号。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"1","constraints":{"minimum":1,"maximum":230}}
  spacegroup_symbol: {"type":"string","nullable":true,"description":"International or Hermann-Mauguin space-group symbol.","description_zh":"结构所属空间群的国际或 Hermann-Mauguin 符号。","group":"structure_and_crystallography","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  point_group: {"type":"string","nullable":true,"description":"Point-group symmetry of the structure.","description_zh":"结构的点群对称性。","group":"structure_and_crystallography","sources":["mp","aflow"],"status":"active"}
  calculation_method: {"type":"string","nullable":true,"description":"High-level method used to obtain the calculation, such as DFT or a derived workflow.","description_zh":"获得该计算结果所采用的高层次方法，例如 DFT 或派生计算流程。","group":"calculation_settings","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  code: {"type":"string","nullable":true,"description":"Name of the simulation program used for the calculation, without its version.","description_zh":"执行计算所使用的模拟程序名称（不含版本）。","group":"calculation_settings","sources":["aflow"],"status":"active"}
  code_version: {"type":"string","nullable":true,"description":"Version of the simulation program used.","description_zh":"计算程序的版本。","group":"calculation_settings","sources":["aflow"],"status":"active"}
  functional: {"type":"string","nullable":true,"description":"Named exchange-correlation functional used in the calculation.","description_zh":"计算所采用的交换-相关泛函名称。","group":"calculation_settings","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  kpoint_mesh: {"type":"array","nullable":true,"description":"Three positive integers for a regular reciprocal-space mesh. Paths or lists of explicit points belong in source artifacts.","description_zh":"规则倒空间网格的三个正整数；显式 k 点和路径保留在来源文件中。","group":"calculation_settings","sources":["aflow"],"status":"active","constraints":{"minItems":3,"maxItems":3,"items":{"type":"integer","minimum":1}}}
  energy_cutoff: {"type":"number","nullable":true,"description":"Plane-wave or basis energy cutoff used in the calculation.","description_zh":"平面波或基组计算使用的能量截断值。","group":"calculation_settings","sources":["aflow"],"status":"active","unit":"eV","constraints":{"minimum":0}}
  total_energy: {"type":"number","nullable":true,"description":"Total energy of the calculated cell.","description_zh":"计算晶胞的总能量。","group":"energy_and_stability","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"eV"}
  energy_per_atom: {"type":"number","nullable":true,"description":"Total energy normalized by the number of atoms.","description_zh":"按原子数归一化后的总能量。","group":"energy_and_stability","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"eV/atom"}
  formation_energy: {"type":"number","nullable":true,"description":"Formation energy of the calculated cell relative to reference states.","description_zh":"相对于参考态的晶胞形成能。","group":"energy_and_stability","sources":["aflow","alexandria"],"status":"active","unit":"eV"}
  formation_energy_per_atom: {"type":"number","nullable":true,"description":"Formation energy normalized per atom.","description_zh":"按原子数归一化后的形成能。","group":"energy_and_stability","sources":["mp","aflow","alexandria"],"status":"active","unit":"eV/atom"}
  energy_above_hull: {"type":"number","nullable":true,"description":"Energy above the thermodynamic convex hull for the chemical system.","description_zh":"材料相对于所属化学体系热力学凸包的能量。","group":"energy_and_stability","sources":["mp","alexandria"],"status":"active","unit":"eV/atom"}
  is_stable: {"type":"boolean","nullable":true,"description":"Source classification indicating whether the material is stable under its stated criterion.","description_zh":"按照数据源判据判断材料是否稳定。","group":"energy_and_stability","sources":["mp"],"status":"active"}
  theoretical: {"type":"boolean","nullable":true,"description":"Whether the record is marked as theoretical rather than experimentally confirmed.","description_zh":"该记录是否被标记为理论预测而非实验确认。","group":"energy_and_stability","sources":["mp"],"status":"active"}
  temperature: {"type":"number","nullable":true,"description":"Temperature associated with the calculation or reported property. Not populated by current adapters; null is required until a producer and its semantics are implemented.","description_zh":"计算或性质对应的温度。","group":"energy_and_stability","sources":[],"status":"reserved","unit":"K","constraints":{"minimum":0,"const":null}}
  pressure: {"type":"number","nullable":true,"description":"Hydrostatic pressure in GPa; AFLOW reports unrelaxed pressure in kbar, converted by factor 0.1.","description_zh":"以 GPa 表示的静水压力；AFLOW 的未弛豫压力由 kbar 乘 0.1 转换。","group":"energy_and_stability","sources":["aflow"],"status":"active","unit":"GPa"}
  band_gap: {"type":"number","nullable":true,"description":"Electronic band gap between the valence-band maximum and conduction-band minimum.","description_zh":"价带顶与导带底之间的电子带隙。","group":"electronic_structure","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"eV","constraints":{"minimum":0}}
  band_gap_type: {"type":"string","nullable":true,"description":"Classification of the band gap, such as direct or indirect.","description_zh":"带隙类型，例如直接带隙或间接带隙。","group":"electronic_structure","sources":["aflow","alexandria","materialscloud"],"status":"active"}
  is_metal: {"type":"boolean","nullable":true,"description":"Whether the electronic structure is classified as metallic.","description_zh":"材料是否被判定为金属。","group":"electronic_structure","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  is_gap_direct: {"type":"boolean","nullable":true,"description":"Whether the fundamental band gap is direct in reciprocal space.","description_zh":"基本带隙是否为直接带隙。","group":"electronic_structure","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  cbm: {"type":"number","nullable":true,"description":"Energy of the conduction-band minimum.","description_zh":"导带底的能量位置。","group":"electronic_structure","sources":["mp"],"status":"active","unit":"eV"}
  vbm: {"type":"number","nullable":true,"description":"Energy of the valence-band maximum.","description_zh":"价带顶的能量位置。","group":"electronic_structure","sources":["mp"],"status":"active","unit":"eV"}
  fermi_level: {"type":"number","nullable":true,"description":"Fermi level reported by the calculation or source.","description_zh":"计算或数据源报告的费米能级。","group":"electronic_structure","sources":["mp","aflow"],"status":"active","unit":"eV"}
  band_structure_path: {"type":"string","nullable":true,"description":"Local path to the electronic band-structure artifact.","description_zh":"能带结构文件的存储路径。","group":"electronic_structure","sources":["aflow"],"status":"active"}
  dos_path: {"type":"string","nullable":true,"description":"Local path to the electronic density-of-states artifact.","description_zh":"电子态密度数据文件的本地路径。","group":"electronic_structure","sources":["aflow"],"status":"active"}
  magnetic_ordering: {"type":"string","nullable":true,"description":"Magnetic ordering classification, such as nonmagnetic, ferromagnetic, or antiferromagnetic.","description_zh":"磁序分类，例如非磁、铁磁或反铁磁。","group":"magnetism","sources":["mp"],"status":"active"}
  total_magnetization: {"type":"number","nullable":true,"description":"Total magnetization of the calculated cell.","description_zh":"计算晶胞的总磁化强度。","group":"magnetism","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"Bohr magneton"}
  magnetization_per_atom: {"type":"number","nullable":true,"description":"Total magnetization normalized per atom.","description_zh":"按原子数归一化后的磁化强度。","group":"magnetism","sources":["aflow","alexandria","materialscloud"],"status":"active","unit":"Bohr magneton/atom"}
  magnetic_site_count: {"type":"integer","nullable":true,"description":"Number of atomic sites carrying a nonzero or source-defined magnetic moment.","description_zh":"带有非零或数据源定义磁矩的原子位点数量。","group":"magnetism","sources":["mp","aflow","alexandria"],"status":"active","unit":"1","constraints":{"minimum":0}}
  magnetic_moments: {"type":"array","nullable":true,"description":"Site-resolved scalar magnetic moments in Bohr magneton, ordered by source atom/site order.","description_zh":"按位点、原子或元素记录的磁矩数值。","group":"magnetism","sources":["aflow","alexandria"],"status":"active","unit":"Bohr magneton","constraints":{"items":{"type":"number"}}}
  bulk_modulus_voigt: {"type":"number","nullable":true,"description":"Voigt estimate of the bulk modulus.","description_zh":"体积模量的 Voigt 估计值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  bulk_modulus_reuss: {"type":"number","nullable":true,"description":"Reuss estimate of the bulk modulus.","description_zh":"体积模量的 Reuss 估计值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  bulk_modulus_vrh: {"type":"number","nullable":true,"description":"Voigt-Reuss-Hill average of the bulk modulus.","description_zh":"体积模量的 Voigt-Reuss-Hill 平均值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  shear_modulus_voigt: {"type":"number","nullable":true,"description":"Voigt estimate of the shear modulus.","description_zh":"剪切模量的 Voigt 估计值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  shear_modulus_reuss: {"type":"number","nullable":true,"description":"Reuss estimate of the shear modulus.","description_zh":"剪切模量的 Reuss 估计值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  shear_modulus_vrh: {"type":"number","nullable":true,"description":"Voigt-Reuss-Hill average of the shear modulus.","description_zh":"剪切模量的 Voigt-Reuss-Hill 平均值。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  youngs_modulus: {"type":"number","nullable":true,"description":"Young modulus describing tensile stiffness.","description_zh":"描述拉伸刚度的杨氏模量。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"GPa"}
  poisson_ratio: {"type":"number","nullable":true,"description":"Poisson ratio describing transverse strain relative to axial strain.","description_zh":"横向应变与轴向应变之比，即泊松比。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"1"}
  elastic_anisotropy: {"type":"number","nullable":true,"description":"Measure of how elastic response varies with direction.","description_zh":"材料弹性响应随方向变化的程度。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active","unit":"1"}
  elastic_tensor_path: {"type":"string","nullable":true,"description":"Local path to the elastic-tensor artifact.","description_zh":"弹性张量文件的存储路径。","group":"elastic_and_mechanical_properties","sources":["mp","aflow"],"status":"active"}
  dielectric_total: {"type":"number","nullable":true,"description":"Source scalar total static relative dielectric response; dimensionless. Scalar averaging convention remains source-specific.","description_zh":"材料的总静态介电响应。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  dielectric_ionic: {"type":"number","nullable":true,"description":"Source scalar ionic relative dielectric contribution; dimensionless.","description_zh":"介电响应中的离子贡献。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  dielectric_electronic: {"type":"number","nullable":true,"description":"Source scalar electronic relative dielectric contribution; dimensionless.","description_zh":"介电响应中的电子贡献。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  refractive_index: {"type":"number","nullable":true,"description":"Optical refractive index reported by the source.","description_zh":"数据源报告的光学折射率。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  piezoelectric_modulus: {"type":"number","nullable":true,"description":"Maximum piezoelectric stress response magnitude from MP e_ij_max, in C/m^2.","description_zh":"MP e_ij_max 对应的压电应力响应最大值，单位 C/m^2。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"C/m^2"}
  piezoelectric_tensor: {"type":"array","nullable":true,"description":"Piezoelectric stress tensor in C/m^2, 3 by 6 in Voigt notation. Reserved: no current producer. Not populated by current adapters; null is required until a producer and its semantics are implemented.","description_zh":"3×6 Voigt 表示的压电应力张量，单位 C/m^2；当前未实现。","group":"dielectric_piezoelectric_and_surface_properties","sources":[],"status":"reserved","unit":"C/m^2","constraints":{"minItems":3,"maxItems":3,"items":{"type":"array","minItems":6,"maxItems":6,"items":{"type":"number"}},"const":null}}
  weighted_surface_energy: {"type":"number","nullable":true,"description":"Surface-orientation-weighted energy in J/m^2. MP eV/Angstrom^2 is converted and cross-checked; weighting is source-defined.","description_zh":"按数据源定义的晶面方向加权或平均后的表面能。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"J/m^2"}
  surface_anisotropy: {"type":"number","nullable":true,"description":"Directional variation of surface energy.","description_zh":"表面能随晶面方向变化的程度。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  weighted_work_function: {"type":"number","nullable":true,"description":"Surface-orientation-weighted work function in eV; weighting is source-defined.","description_zh":"按数据源定义的表面方向加权或平均后的功函数。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"eV"}
  shape_factor: {"type":"number","nullable":true,"description":"Dimensionless shape or geometric factor supplied by the source.","description_zh":"数据源提供的无量纲形状或几何因子。","group":"dielectric_piezoelectric_and_surface_properties","sources":["mp"],"status":"active","unit":"1"}
  phonon_band_structure_path: {"type":"string","nullable":true,"description":"Local path to the phonon band-structure artifact.","description_zh":"声子能带结构数据文件的本地路径。","group":"phonon_and_thermal_properties","sources":["aflow"],"status":"active"}
  phonon_dos_path: {"type":"string","nullable":true,"description":"Local path to the phonon density-of-states artifact.","description_zh":"声子态密度数据文件的本地路径。","group":"phonon_and_thermal_properties","sources":["aflow"],"status":"active"}
  debye_temperature: {"type":"number","nullable":true,"description":"Debye temperature derived or reported for the material.","description_zh":"材料的德拜温度。","group":"phonon_and_thermal_properties","sources":["mp","aflow"],"status":"active","unit":"K","constraints":{"minimum":0}}
  thermal_conductivity: {"type":"number","nullable":true,"description":"Lattice thermal conductivity. The current AFLOW adapter supplies the AGL scalar at 300 K; do not compare at other temperatures without source metadata.","description_zh":"晶格热导率；当前 AFLOW 提供 AGL 的 300 K 标量，比较时应检查温度与来源。","group":"phonon_and_thermal_properties","sources":["aflow"],"status":"active","unit":"W/(m*K)","constraints":{"minimum":0}}
  xas_path: {"type":"string","nullable":true,"description":"Local path to the X-ray absorption spectroscopy artifact. Not populated by current adapters; null is required until a producer and its semantics are implemented.","description_zh":"X 射线吸收光谱数据文件的本地路径。","group":"provenance_and_artifacts","sources":[],"status":"reserved","constraints":{"const":null}}
  property_paths: {"type":"object","nullable":true,"description":"Mapping from property names to local artifact paths.","description_zh":"性质名称到文件路径的映射。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"additionalProperties":{"type":"string"}}}
  property_errors: {"type":"object","nullable":true,"description":"Errors encountered while retrieving or processing individual properties.","description_zh":"获取或处理各项性质时产生的错误信息。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria"],"status":"active","constraints":{"additionalProperties":{"type":"string"}}}
  download_status: {"type":"string","nullable":true,"description":"Pipeline outcome after artifact retrieval; success does not imply every physical property exists.","description_zh":"记录或相关数据文件的下载状态。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"enum":["success","partial","failed"]}}
  properties_requested: {"type":"boolean","nullable":true,"description":"Whether optional property or artifact retrieval was requested in this run.","description_zh":"此次是否请求了额外属性或文件下载。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  raw_path: {"type":"string","nullable":true,"description":"Local path to the raw source record.","description_zh":"原始数据源记录的本地路径。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}

  retrieved_at: {"type":"string","nullable":false,"description":"Time when the source record was retrieved by the crawler.","description_zh":"爬虫获取数据源记录的时间。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"format":"date-time"}}
  updated_at: {"type":"string","nullable":true,"description":"Source or pipeline last-update string. Legacy AFLOW date text is preserved, so this field has no strict date-time format.","description_zh":"标准化或存储记录最近一次更新的时间。","group":"provenance_and_artifacts","sources":["aflow"],"status":"active"}
  schema_version: {"type":"string","nullable":false,"description":"Version of the normalized DFT schema used for this record.","description_zh":"该记录使用的标准 schema 版本。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"const":"3.0"}}
  api_version: {"type":"string","nullable":true,"description":"Version of the upstream API or endpoint that supplied the record.","description_zh":"提供该记录的数据源 API 或接口版本。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  content_hash: {"type":"string","nullable":true,"description":"SHA-256 of raw JSON serialized with sorted keys, UTF-8, no ASCII escaping and compact separators; excludes normalized pipeline metadata.","description_zh":"对原始 JSON 按键排序、紧凑 UTF-8 编码计算 SHA-256；不包含归一化流程元数据。","group":"provenance_and_artifacts","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"pattern":"^[a-f0-9]{64}$"}}
  license: {"type":"string","nullable":true,"description":"Upstream reuse license, when explicitly supplied; never inferred from missing data. Not populated by current adapters; null is required until a producer and its semantics are implemented.","description_zh":"数据源规定的数据使用或再分发许可。","group":"provenance_and_artifacts","sources":[],"status":"reserved","constraints":{"const":null}}
  citation: {"type":"string","nullable":true,"description":"Upstream recommended citation or DOI, when explicitly supplied. Not populated by current adapters; null is required until a producer and its semantics are implemented.","description_zh":"数据源要求或推荐使用的论文、DOI 或引用信息。","group":"provenance_and_artifacts","sources":[],"status":"reserved","constraints":{"const":null}}
  formula_anonymous: {"type":"string","nullable":true,"description":"Anonymous formula that preserves stoichiometric pattern while replacing element names.","description_zh":"保留化学计量模式、但用匿名元素替代真实元素名称的化学式。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  composition_reduced: {"type":"object","nullable":true,"description":"Element amounts reduced to the smallest stoichiometric ratio, independent of the represented cell atom count.","description_zh":"按最简整数比归一化后的组成映射。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","constraints":{"additionalProperties":{"type":"number","minimum":0}}}
  density_atomic: {"type":"number","nullable":true,"description":"Atomic number density, computed as atom_count / cell volume in atom/Angstrom^3. MP density_atomic is not copied because its implementation and documentation disagree.","description_zh":"原子数密度，由原子数除以晶胞体积计算；不直接复制定义与实现不一致的 MP 同名值。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active","unit":"atom/Angstrom^3","constraints":{"exclusiveMinimum":0}}
  decomposes_to: {"type":"array","nullable":true,"description":"Decomposition products with source material identifier, formula and amount in formula units. Applicable to unstable or metastable materials.","description_zh":"分解产物列表，包含来源材料编号、化学式及以化学式单元计的量。","group":"extended_and_source_fields","sources":["mp","alexandria"],"status":"active","constraints":{"items":{"type":"object","properties":{"material_id":{"type":["string","null"]},"formula":{"type":["string","null"]},"amount":{"type":["number","null"],"minimum":0}},"additionalProperties":true}}}
  deprecation_reasons: {"type":"array","nullable":true,"description":"Reasons supplied by the source for deprecating the record.","description_zh":"数据源给出的记录废弃原因。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":["string","object"]}}}
  grain_boundaries: {"type":"array","nullable":true,"description":"Grain-boundary structures or properties reported by the source.","description_zh":"数据源报告的晶界结构或晶界性质。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":"object"}}}
  has_props: {"type":"object","nullable":true,"description":"Source-level availability map or summary for requested properties.","description_zh":"数据源对各项请求性质可用性的映射或摘要。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"additionalProperties":{"type":"boolean"}}}
  has_reconstructed: {"type":"boolean","nullable":true,"description":"Whether any of the material's calculated surfaces are reconstructed.","description_zh":"材料的已计算表面是否包含重构表面。","group":"extended_and_source_fields","sources":["mp"],"status":"active"}
  is_magnetic: {"type":"boolean","nullable":true,"description":"Whether the record is classified as magnetic.","description_zh":"该记录对应的材料是否被判定为磁性材料。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  last_updated: {"type":"string","nullable":true,"description":"Last-update timestamp reported by the upstream source.","description_zh":"上游数据源报告的最近更新时间。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  num_unique_magnetic_sites: {"type":"integer","nullable":true,"description":"Number of symmetry-unique magnetic sites.","description_zh":"对称性不等价的磁性位点数量。","group":"extended_and_source_fields","sources":["mp"],"status":"active","unit":"1","constraints":{"minimum":0}}
  origins: {"type":"array","nullable":true,"description":"Provenance records describing where the material or property data originated.","description_zh":"材料或性质数据来源的 provenance 记录。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":"object"}}}
  possible_species: {"type":"array","nullable":true,"description":"Species or oxidation-state candidates considered possible for the structure.","description_zh":"结构中可能的物种或氧化态候选集合。","group":"extended_and_source_fields","sources":["mp","aflow"],"status":"active","constraints":{"items":{"type":"string"}}}
  property_name: {"type":"string","nullable":true,"description":"Name of the property represented by the record or artifact.","description_zh":"该记录或文件所代表的性质名称。","group":"extended_and_source_fields","sources":["mp"],"status":"active"}
  types_of_magnetic_species: {"type":"array","nullable":true,"description":"Chemical species identified as carrying magnetic moments.","description_zh":"被识别为携带磁矩的化学物种。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":"string"}}}
  uncorrected_energy_per_atom: {"type":"number","nullable":true,"description":"Uncorrected total energy normalized per atom.","description_zh":"未修正总能量按原子数归一化后的值。","group":"extended_and_source_fields","sources":["mp","aflow"],"status":"active","unit":"eV/atom"}
  warnings: {"type":"array","nullable":true,"description":"Warnings emitted by the source or normalization pipeline.","description_zh":"数据源或标准化流程产生的警告信息。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":"string"}}}
  bandstructure_summary: {"type":"object","nullable":true,"description":"Provider-specific band-structure metadata; complete data are referenced by property_paths or band_structure_path.","description_zh":"电子能带结构的摘要或派生元数据。","group":"extended_and_source_fields","sources":["mp","aflow"],"status":"active"}
  dos_summary: {"type":"object","nullable":true,"description":"Provider-specific DOS metadata; complete data are referenced by property_paths or dos_path.","description_zh":"电子态密度的摘要或派生元数据。","group":"extended_and_source_fields","sources":["mp","aflow"],"status":"active"}
  dos_energy_up: {"type":"number","nullable":true,"description":"Spin-up DOS band gap, a scalar energy; not a DOS energy grid.","description_zh":"自旋向上 DOS 带隙，单位 eV，为标量而非能量网格。","group":"extended_and_source_fields","sources":["mp"],"status":"active","unit":"eV","constraints":{"minimum":0}}
  dos_energy_down: {"type":"number","nullable":true,"description":"Spin-down DOS band gap, a scalar energy; not a DOS energy grid.","description_zh":"自旋向下 DOS 带隙，单位 eV，为标量而非能量网格。","group":"extended_and_source_fields","sources":["mp"],"status":"active","unit":"eV","constraints":{"minimum":0}}
  xas_summary: {"type":"array","nullable":true,"description":"List of MP XAS summary entries; route documents are referenced by property_paths.","description_zh":"MP XAS 摘要条目列表；详细数据通过 property_paths 引用。","group":"extended_and_source_fields","sources":["mp"],"status":"active","constraints":{"items":{"type":"object"}}}
  builder_meta: {"type":"object","nullable":true,"description":"Source-native builder metadata object. Keys are provider-specific and preserved for provenance.","description_zh":"来源构建流程元数据对象；内部键采用来源自己的定义。","group":"extended_and_source_fields","sources":["mp"],"status":"active"}
  source_documents: {"type":"object","nullable":true,"description":"Raw source documents used to build the normalized record.","description_zh":"用于构建标准记录的原始来源文档。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}
  source_extra: {"type":"object","nullable":true,"description":"Unmapped upstream or adapter-enriched values, retained with source-specific semantics; excluded from cross-source equivalence claims.","description_zh":"未提升为标准字段、但保留的来源特有字段。","group":"extended_and_source_fields","sources":["mp","aflow","alexandria","materialscloud"],"status":"active"}









